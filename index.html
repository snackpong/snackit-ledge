<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스낵킷 장부</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <section id="login-screen" class="screen center" hidden>
    <div class="card">
      <h1>스낵킷 장부</h1>
      <p class="muted">사장님 전용 통합 장부</p>
      <button class="btn btn-primary" id="login-btn">Google로 로그인</button>
      <p class="error" id="login-error"></p>
    </div>
  </section>

  <section id="blocked-screen" class="screen center" hidden>
    <div class="card">
      <h1>접근 거부</h1>
      <p>이 사이트는 사장님 본인만 사용할 수 있어요.</p>
      <p class="muted">로그인 이메일: <span id="blocked-email"></span></p>
      <button class="btn" id="blocked-retry">다시 로그인</button>
    </div>
  </section>

  <section id="app-screen" class="screen" hidden>
    <header class="topbar">
      <div class="brand">스낵킷 장부</div>
      <nav id="nav" class="nav"></nav>
      <div class="user">
        <span id="user-email" class="muted"></span>
        <button class="btn btn-ghost" id="logout-btn">로그아웃</button>
      </div>
    </header>
    <main id="page-mount" class="page-mount"></main>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
